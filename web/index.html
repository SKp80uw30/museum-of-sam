<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import { createForestSky } from './forest-sky.js?v=20260911-2'
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'
import { CHARACTERS, birthdayName, HONEY_FILE } from './garden-characters.mjs?v=4'

// ─────────────────────────────────────────────────────────────────────────
// Tunables — per-theme. Every 5 scenes shares this one loader (Phase 5/7);
// picking a theme only swaps this THEME object, nothing else in the file.
// ─────────────────────────────────────────────────────────────────────────
const reviewParams = new URLSearchParams(location.search)
const reviewMode = reviewParams.get('review') === '1'
const SCENE_ORDER = ['reef', 'forest', 'jumping_castle', 'gallery_home']
const sceneId = SCENE_ORDER.includes(reviewParams.get('scene')) ? reviewParams.get('scene') : 'reef'
const EYE_HEIGHT = 1.6
const MOVE_SPEED = 3.2          // units/sec
const FALLBACK_GROUND_Y = 0
const COLLISION_RADIUS = 0.35   // how close the player can get to a collider
// Jumping — jumping_castle only (see tryJump()). Sized to feel like a real
// hop on an inflatable floor, not a superhero leap: ~0.5m peak height, a
// little forward drift while airborne, and a couple of decaying settle
// bounces on landing rather than stopping dead.
const JUMP_HEIGHT = 0.5           // meters, peak height above the floor
const JUMP_GRAVITY = -20          // m/s^2, slightly stronger than real gravity for a snappy arc
const JUMP_VELOCITY = Math.sqrt(2 * -JUMP_GRAVITY * JUMP_HEIGHT)
const JUMP_FORWARD_BOOST = 1.5    // m/s of extra forward drift on takeoff, decays fast
const JUMP_FORWARD_DECAY = 0.001  // per-second multiplier applied via Math.pow(., dt)
const JUMP_BOUNCE_DAMPING = 0.4   // fraction of impact speed kept on each settle bounce
const JUMP_MIN_BOUNCE_VELOCITY = 0.6  // below this, the bounce is considered settled
const JUMP_REJUMP_THRESHOLD = 0.05    // must be back this close to the floor to jump again
const PARTICLE_COUNT = 220
const PARTICLE_FIELD_RADIUS = 12  // z-distance ahead/behind camera the drifting particulates span

const THEMES = {
  reef: {
    title: 'Museum of Sam — Underwater Reef',
    shortLabel: 'Underwater Reef',
    navIcon: '🌊',
    sceneUrl: '../exports/underwater_reef.glb?v=20260911-reef4',
    // Bright, sunlit shallow-water look (see Museum-locations reference) —
    // not a deep-ocean-at-night mood. Was 0x0a2530/0.045, which read as a
    // near-black background with everything past a few meters swallowed by fog.
    fogColor: 0x348f9f,
    fogDensity: 0.023,       // low enough that the far end of the 60m corridor stays visible — "crystal clear water"
    colliderPrefixes: [/^Post_/, /^Rock_/],
    lightIntensities: { Sun: 3.2, Fill: 1.4, fallbackDivisor: 700 },
    hemisphere: { sky: 0x9fdfff, ground: 0x8a6a3f, intensity: 0.5 },
    gradeTint: 0x8fd6e8, gradeTintStrength: 0.12, gradeVignette: 0.28,
    bloom: { strength: 0.25, radius: 0.5, threshold: 2.0 },
    particleColor: 0xcdeff5, particleOpacity: 0.5,
    shaftColor: 0xdff5ff, shaftOpacity: 0.07,
    creditsLabel: 'Coral models (CC-BY):',
    // CC-BY coral models from Sketchfab, dense-scattered along both walls
    // (Phase 2 revision, see TODO.md) — attribution required by license.
    credits: [
      { title: 'Coral Reef 3 L', author: 'stefanorivera', url: 'https://sketchfab.com/3d-models/cb1f7998ca5f452cb8a29ed4162d7a32' },
      { title: 'Coral reef', author: 'ilay-sh-r', url: 'https://sketchfab.com/3d-models/103b64ddab724c11a25ac1b80b6a073d' },
      { title: 'Coral reef.1', author: 'Sefaros', url: 'https://sketchfab.com/3d-models/4641a13a0ffb42859f8b6d914951a5fd' },
    ],
  },
  forest: {
    title: 'Museum of Sam — Forest Walkway',
    shortLabel: 'Forest Walkway',
    navIcon: '🌲',
    sceneUrl: '../exports/forest_walkway.glb?v=20260911-forest3',
    // Dappled canopy-green mood (see Museum-locations forest reference) —
    // a lighter, warmer haze than the reef's blue-teal water fog.
    fogColor: 0xc2dbdd,
    fogDensity: 0.013,       // canopy already darkens the far end; keep fog light so frames stay legible
    colliderPrefixes: [],
    walkBounds: { minX: -1.15, maxX: 1.15, minZ: -59.5, maxZ: 0 },
    exposure: 1.35,
    lightIntensities: { Sun: 3.6, Fill: 2.0, fallbackDivisor: 700 },
    hemisphere: { sky: 0xcde7ff, ground: 0x77704e, intensity: 1.65 },
    gradeTint: 0xe1e8c9, gradeTintStrength: 0.025, gradeVignette: 0.15,
    bloom: { strength: 0.18, radius: 0.4, threshold: 2.0 },
    particleColor: 0xf5e6b8, particleOpacity: 0.16,   // dust motes in the sunbeams rather than underwater silt
    shaftColor: 0xfff2c9, shaftOpacity: 0.055,
    creditsLabel: 'Nature assets (CC0, Poly Pizza):',
    credits: [
      { title: 'Fern', author: 'Quaternius', url: 'https://poly.pizza/m/jqcanvH7D6' },
      { title: 'Grass', author: 'Quaternius', url: 'https://poly.pizza/m/iw6l7gqcdQ' },
      { title: 'Vines', author: 'Quaternius', url: 'https://poly.pizza/m/EVS4viM9BL' },
      { title: 'Pothos Vine Large', author: 'Isa Lousberg', url: 'https://poly.pizza/m/HG1d091bLo' },
    ],
  },
  jumping_castle: {
    title: 'Museum of Sam — Jumping Castle',
    shortLabel: 'Jumping Castle',
    navIcon: '🎪',
    sceneUrl: '../exports/jumping_castle.glb?v=20260911-jc4',
    // Giant inflatable yellow/green vinyl tunnel (see Museum-locations art
    // gallery reference — despite the source filename, it's actually a
    // bounce-castle tunnel repurposed as an exhibit space) — warm gold
    // haze from the glossy ribbed walls, not the cool blue/green mood of
    // the other two themes.
    fogColor: 0xc7b99a,
    fogDensity: 0.006,
    colliderPrefixes: [],
    exposure: 1.05,
    walkBounds: { minX: -1.30, maxX: 1.30, minZ: -59.8, maxZ: 0 },
    lightIntensities: { Sun: 1.3, Fill: 0.6, fallbackDivisor: 700 },
    hemisphere: { sky: 0xfff6e1, ground: 0x4c5744, intensity: 0.3 },
    gradeTint: 0xf5d98a, gradeTintStrength: 0.025, gradeVignette: 0.14,
    bloom: { strength: 0.22, radius: 0.4, threshold: 2.0 },
    particleColor: 0xffe8a8, particleOpacity: 0.0,
    shaftColor: 0xffdf9c, shaftOpacity: 0.0,
    creditsLabel: 'All-procedural scene — no external model assets.',
    credits: [],
  },
  gallery_home: {
    title: 'Museum of Sam — Gallery Home',
    shortLabel: 'Gallery Home',
    navIcon: '🏛️',
    sceneUrl: '../exports/gallery_home.glb?v=20260911-gh1',
    // Expensive designer-house hallway (see Museum-locations "beautiful
    // large hallway in an expensive designer house" reference) — clean,
    // bright, warm-neutral interior lit mostly by its own baked-in
    // emissive fixtures (cove strips, recessed downlights, sconces, a
    // hanging pendant), not the moody colored-haze mood of the other 3.
    fogColor: 0xf2e9da,
    fogDensity: 0.008,
    colliderPrefixes: [],   // furniture/wall panels sit close to the mounts, same "no collision yet" precedent as forest/jumping_castle
    exposure: 1.25,
    lightIntensities: { Sun: 3.2, Fill: 2.0, fallbackDivisor: 700 },
    // three.js has no real light bounce, so the ceiling underside (which
    // gets no direct light — the cove/downlight fixtures are baked-emissive
    // meshes that glow themselves but don't illuminate neighbors) reads
    // far darker here than in the Cycles preview render, which does bounce
    // light. HemisphereLight is the cheap fake-GI stand-in already used for
    // the reef/forest shadow-fill problem — pushed harder here since this
    // scene has no other ambient source doing that job.
    hemisphere: { sky: 0xf5ecd9, ground: 0xe8d9bd, intensity: 2.6 },
    gradeTint: 0xfff2d9, gradeTintStrength: 0.04, gradeVignette: 0.15,
    bloom: { strength: 0.16, radius: 0.35, threshold: 2.5 },
    particleColor: 0xfff2d9, particleOpacity: 0.08,
    shaftColor: 0xfff2d9, shaftOpacity: 0.02,
    creditsLabel: 'Floor/wall textures (CC0, PolyHaven):',
    credits: [
      { title: 'Interior Tiles', author: 'PolyHaven', url: 'https://polyhaven.com/a/interior_tiles' },
      { title: 'Granite Tile 03', author: 'PolyHaven', url: 'https://polyhaven.com/a/granite_tile_03' },
      { title: 'Beige Wall 002', author: 'PolyHaven', url: 'https://polyhaven.com/a/beige_wall_002' },
      { title: 'Dirty Carpet', author: 'PolyHaven', url: 'https://polyhaven.com/a/dirty_carpet' },
    ],
  },
}
const THEME = THEMES[sceneId]
const SCENE_URL = THEME.sceneUrl
const FOG_COLOR = THEME.fogColor
const FOG_DENSITY = THEME.fogDensity

// Real artwork is swapped into every Canvas_* mesh (see the glTF export) at
// runtime from a shared pool of photos — see tools/prepare_artwork.py, which
// converts Photos/ (drop in any file or folder of photos, recursively) into
// web/artwork/photos/*.jpg plus this manifest.
// Every wing draws its own random, non-repeating subset of the pool on each
// page load (no theme owns specific photos), and frames keep quietly
// reshuffling to a fresh, unused photo every so often while you walk — so
// no two logins, and no two long visits, look quite the same.
const ARTWORK_BASE = './artwork/photos/'
const ARTWORK_MANIFEST_URL = './artwork/photos-manifest.json'
const ARTWORK_ROTATE_MIN_MS = 45000
const ARTWORK_ROTATE_MAX_MS = 100000
const ARTWORK_FADE_SECONDS = 0.9
const artworkManifestPromise = fetch(ARTWORK_MANIFEST_URL)
  .then((r) => (r.ok ? r.json() : []))
  .catch(() => [])

// ─────────────────────────────────────────────────────────────────────────

const loadingEl = document.getElementById('loading')
const overlayEl = document.getElementById('overlay')
const crosshairEl = document.getElementById('crosshair')
const hotspotHintEl = document.getElementById('hotspot-hint')
const hudEl = document.getElementById('hud')

document.title = THEME.title
document.getElementById('overlay-title').textContent = THEME.title

// ── Scene nav — bottom-left tiles, always on top, jump to any wing without
// walking back to a start point first. Number keys 1–4 mirror the tiles so
// the same jump works even while Pointer Lock has the cursor hidden (a
// locked page can't hit-test a click against an arbitrary DOM element, but
// keydown still fires normally).
function goToScene(id) {
  if (id === sceneId) return
  if (document.pointerLockElement) document.exitPointerLock()
  const url = new URL(location.href)
  url.searchParams.set('scene', id)
  location.href = `${url.pathname}${url.search}`
}
const sceneNavEl = document.getElementById('scene-nav')
SCENE_ORDER.forEach((id, i) => {
  const t = THEMES[id]
  const btn = document.createElement('button')
  btn.className = id === sceneId ? 'active' : ''
  btn.title = `${t.shortLabel} (${i + 1})`
  btn.innerHTML = `<span class="icon">${t.navIcon}</span><span class="label">${t.shortLabel.split(' ')[0]}</span>`
  btn.addEventListener('click', (e) => { e.stopPropagation(); goToScene(id) })
  sceneNavEl.appendChild(btn)
})
sceneNavEl.addEventListener('click', (e) => e.stopPropagation())
window.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return
  const n = Number(e.key)
  if (n >= 1 && n <= SCENE_ORDER.length) goToScene(SCENE_ORDER[n - 1])
})

const creditsToggleEl = document.getElementById('credits-toggle')
const creditsPanelEl = document.getElementById('credits-panel')
creditsPanelEl.innerHTML = `<strong>${THEME.creditsLabel}</strong><br>` + THEME.credits.map(
  (c) => `${c.title} — <a href="${c.url}" target="_blank" rel="noopener">${c.author}</a>`
).join('<br>')
creditsToggleEl.addEventListener('click', () => creditsPanelEl.classList.toggle('show'))

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
renderer.setSize(window.innerWidth, window.innerHeight)
renderer.setClearColor(FOG_COLOR)
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = THEME.exposure ?? 1.3
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFShadowMap
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color(FOG_COLOR)
const forestSky = sceneId === 'forest' ? createForestSky(scene) : null
if (sceneId === 'jumping_castle') {
  const pmrem = new THREE.PMREMGenerator(renderer)
  const room = new RoomEnvironment()
  scene.environment = pmrem.fromScene(room, 0.06).texture
  scene.environmentIntensity = 0.22
  room.dispose()
  pmrem.dispose()
}
// Per-fragment depth fog — cheap, standard technique for underwater haze.
// Not the same mechanism as Blender's world Volume Scatter (see CLAUDE.md),
// which renders fully black in EEVEE Next; this is a three.js render-side
// effect applied after export, deferred here to Phase 6 as planned.
scene.fog = new THREE.FogExp2(FOG_COLOR, FOG_DENSITY)
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 200)
camera.rotation.order = 'YXZ'

// ── Post-processing: bloom + underwater color grading/vignette ──────────
const UnderwaterGradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    tint: { value: new THREE.Color(THEME.gradeTint) },
    tintStrength: { value: THEME.gradeTintStrength },
    vignetteStrength: { value: THEME.gradeVignette },
  },
  vertexShader: /* glsl */ `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */ `
    uniform sampler2D tDiffuse;
    uniform vec3 tint;
    uniform float tintStrength;
    uniform float vignetteStrength;
    varying vec2 vUv;
    void main() {
      vec4 color = texture2D(tDiffuse, vUv);
      color.rgb = mix(color.rgb, color.rgb * tint, tintStrength);
      float dist = distance(vUv, vec2(0.5));
      float vig = smoothstep(0.35, 0.85, dist);
      color.rgb *= 1.0 - vig * vignetteStrength;
      gl_FragColor = color;
    }
  `,
}

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  THEME.bloom.strength,  // subtle glow on bright highlights, not a full blowout
  THEME.bloom.radius,
  // UnrealBloomPass thresholds against pre-tonemap HDR luminance, not the
  // final 0–1 LDR image — with the bright pale-sand + real coral assets
  // from the reef quality pass, a "0.78" threshold caught almost the whole
  // frame and washed everything into a pervasive white haze. 2.0 restricts

  THEME.bloom.threshold,
)
composer.addPass(bloomPass)

function makeSoftDiscTexture() {
  const size = 64
  const canvas = document.createElement('canvas')
  canvas.width = canvas.height = size
  const ctx = canvas.getContext('2d')
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2)
  grad.addColorStop(0, 'rgba(255,255,255,0.9)')
  grad.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.fillStyle = grad
  ctx.fillRect(0, 0, size, size)
  const tex = new THREE.CanvasTexture(canvas)
  tex.colorSpace = THREE.SRGBColorSpace
  return tex
}

function makeShaftTexture() {
  const w = 64, h = 256
  const canvas = document.createElement('canvas')
  canvas.width = w
  canvas.height = h
  const ctx = canvas.getContext('2d')
  const grad = ctx.createLinearGradient(0, 0, 0, h)
  grad.addColorStop(0, 'rgba(255,255,255,0.55)')
  grad.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.fillStyle = grad
  ctx.fillRect(0, 0, w, h)
  // destination-in only reads the mask's alpha channel, not its RGB — the
  // stops below must vary alpha (0 at the edges, 1 at the center) or the
  // taper has no effect and the shaft renders as a hard-edged slab.
  const horiz = ctx.createLinearGradient(0, 0, w, 0)
  horiz.addColorStop(0, 'rgba(255,255,255,0)')
  horiz.addColorStop(0.5, 'rgba(255,255,255,1)')
  horiz.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.globalCompositeOperation = 'destination-in'
  ctx.fillStyle = horiz
  ctx.fillRect(0, 0, w, h)
  const tex = new THREE.CanvasTexture(canvas)
  tex.colorSpace = THREE.SRGBColorSpace
  return tex
}

function spawnConfettiCelebration() {
  const forward = new THREE.Vector3(); camera.getWorldDirection(forward)
  const origin = camera.position.clone().add(forward.multiplyScalar(1.0)).add(new THREE.Vector3(0, 0.15, 0))
  const confettiColors = [0xff5e5e, 0xffd75e, 0x5ee6ff, 0x8fff6e, 0xff8fd0, 0xb08fff]

// Click hotspots use an "aim cone" test (angle from camera-forward, within
// range) rather than exact mesh raycasting — far more forgiving for small/
// thin decorative props and skinned fish than a triangle-precise raycast.
// Shared by the actual click dispatch (respects cooldown, so a just-fired
// egg doesn't re-trigger while its own effect is still playing) and the
// per-frame hover hint below (ignores cooldown — the object is still an
// egg worth calling out even mid-cooldown).
function findAimedClickHotspot(respectCooldown) {
  const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir)
  const now = performance.now() / 1000
  let best = null, bestAngle = Infinity
  for (const h of hotspots) {
    if (h.trigger !== 'click') continue
    if (respectCooldown && now - h.lastTriggered < h.cooldown) continue
    const pos = h.getWorldPos(); if (!pos) continue
    const toTarget = pos.clone().sub(camera.position)
    const dist = toTarget.length()
    if (dist > h.maxDistance) continue
    toTarget.normalize()
    const angle = camDir.angleTo(toTarget)
    if (angle > h.aimAngle) continue
    if (angle < bestAngle) { bestAngle = angle; best = h }
  }
  return best
}
function tryClickHotspot() {
  if (!hallwayReady) return
  const best = findAimedClickHotspot(true)
  if (best) {
    best.lastTriggered = performance.now() / 1000
    best.run(best)
    markFound(best.id, best.name)
  }
}
// Per-frame "is the crosshair currently over an egg" indicator — a lit,
// pulsing crosshair plus a name hint, so aiming around visibly tells you
// something's interactive before you commit to a click (walk/jump-trigger
// eggs have no equivalent since those fire automatically by proximity).
let hoveredHotspot = null
function updateHotspotHoverHint() {
  if (!hallwayReady || !(controls.isLocked || mobileActive)) {
    if (hoveredHotspot) { hoveredHotspot = null; crosshairEl.classList.remove('hotspot'); hotspotHintEl.classList.remove('show') }
    return
  }
  const best = findAimedClickHotspot(false)
  if (best === hoveredHotspot) return
  hoveredHotspot = best
  if (best) {
    crosshairEl.classList.add('hotspot')
    hotspotHintEl.textContent = foundEggs.has(best.id) ? `👀 ${best.name} (found)` : `🥚 Click to open`
    hotspotHintEl.classList.add('show')
  } else {
    crosshairEl.classList.remove('hotspot')
    hotspotHintEl.classList.remove('show')
  }
}
function updateProximityHotspots() {
  if (!hallwayReady) return
  const now = performance.now() / 1000
  for (const h of hotspots) {
    if (h.trigger !== 'walk') continue
    if (now - h.lastTriggered < h.cooldown) continue
    const pos = h.getWorldPos(); if (!pos) continue
    const dx = camera.position.x - pos.x, dz = camera.position.z - pos.z
    if (dx * dx + dz * dz < h.radius * h.radius) {
      h.lastTriggered = now
      h.run(h)
      markFound(h.id, h.name)
    }
  }
}
// Fired from the jump-landing physics in tick() — inert for every scene
// except jumping_castle, which is the only one that ever sets `jumping`.
function onJumpLanding() {
  if (!hallwayReady) return
  const now = performance.now() / 1000

    if (now - h.lastTriggered < h.cooldown) continue
    const pos = h.getWorldPos(); if (!pos) continue
    const dx = camera.position.x - pos.x, dz = camera.position.z - pos.z
    if (dx * dx + dz * dz < h.radius * h.radius) {

// ── Effect primitive 1: squish-pulse — scale up/down on a spring-ish tween.
function squishPulse(mesh, opts = {}) {
  const { peak = 1.35, duration = 0.5 } = opts
  const baseScale = mesh.userData.__eggBaseScale || mesh.scale.clone()
  mesh.userData.__eggBaseScale = baseScale
  let elapsed = 0
  addEggAnimation((dt) => {
    elapsed += dt
    const t = elapsed / duration
    if (t >= 1) { mesh.scale.copy(baseScale); return false }
    const s = 1 + Math.sin(Math.min(1, t) * Math.PI) * (peak - 1)
    mesh.scale.set(baseScale.x * s, baseScale.y * s, baseScale.z * s)
    return true
  })
}

// ── Effect primitive: particle-burst — one-shot spawned sprite burst.
function particleBurst(position, opts = {}) {
  const {
    color = 0xffffff, count = 20, spread = 0.5, speed = 1.0, size = 0.05,
    duration = 1.2, gravity = -0.4,
  } = opts
  const positions = new Float32Array(count * 3)
  const velocities = []
  for (let i = 0; i < count; i++) {
    positions[i * 3 + 0] = position.x + (Math.random() - 0.5) * spread
    positions[i * 3 + 1] = position.y + (Math.random() - 0.5) * spread
    positions[i * 3 + 2] = position.z + (Math.random() - 0.5) * spread
    const theta = Math.random() * Math.PI * 2
    const phi = Math.random() * Math.PI
    velocities.push(new THREE.Vector3(
      Math.sin(phi) * Math.cos(theta),
      Math.abs(Math.cos(phi)) + 0.3,
      Math.sin(phi) * Math.sin(theta),
    ).multiplyScalar(speed * (0.4 + Math.random() * 0.6)))
  }
  const geo = new THREE.BufferGeometry()
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3))
  const mat = new THREE.PointsMaterial({
    size, map: burstSpriteTexture, transparent: true, depthWrite: false,
    color, sizeAttenuation: true, opacity: 1,
  })
  const points = new THREE.Points(geo, mat)
  scene.add(points)
  let elapsed = 0
  addEggAnimation((dt) => {
    elapsed += dt
    const arr = geo.attributes.position.array
    for (let i = 0; i < count; i++) {
      velocities[i].y += gravity * dt
      arr[i * 3 + 0] += velocities[i].x * dt
      arr[i * 3 + 1] += velocities[i].y * dt
      arr[i * 3 + 2] += velocities[i].z * dt
    }
    geo.attributes.position.needsUpdate = true
    mat.opacity = Math.max(0, 1 - elapsed / duration)
    if (elapsed >= duration) {
      scene.remove(points)
      geo.dispose(); mat.dispose()
      return false
    }
    return true
  })
}

function pickAccessory(d) {

  if (d.bow) return { type: 'bow', color: 0x162e3f }
  if (d.lei) return { type: 'lei' }
  if (d.necklace) return { type: 'necklace' }
  if (d.flower) return { type: 'flower', color: d.flower }

    group.add(beard)
  } else if (acc?.type === 'bow') {
    const bow = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.028, 0.014), new THREE.MeshStandardMaterial({ color: acc.color }))
    bow.position.set(0, 0.225, 0.08)
    group.add(bow)
  } else if (acc?.type === 'lei' || acc?.type === 'necklace') {
    const petalColors = acc.type === 'lei' ? [0xed6eaf, 0xffe160, 0xa7dd6e, 0x71cde8] : [0x54c7e2]
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2
      const petal = new THREE.Mesh(new THREE.SphereGeometry(0.013, 6, 5), new THREE.MeshStandardMaterial({ color: petalColors[i % petalColors.length] }))
      petal.position.set(Math.cos(a) * 0.085, 0.19 - Math.sin(a) * 0.015, Math.sin(a) * 0.03 + 0.06)
      group.add(petal)
    }
  } else if (acc?.type === 'flower') {
    const flower = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), new THREE.MeshStandardMaterial({ color: acc.color }))
    flower.position.set(-0.075, 0.335, 0.04)
    group.add(flower)
  } else if (acc?.type === 'mask') {
    // Black helmet with a chrome visor bar — the toy-figure shorthand for
    // the same masked look the garden avatar builds in full.
    const shellMat = new THREE.MeshStandardMaterial({ color: 0x191a1f, roughness: 0.35, metalness: 0.2 })
    const shell = new THREE.Mesh(new THREE.SphereGeometry(0.093, 12, 10), shellMat)
    shell.position.set(0, 0.303, 0.005)
    shell.scale.set(1, 1.02, 1)
    group.add(shell)
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.016, 0.02), new THREE.MeshStandardMaterial({ color: 0x05060a }))
    visor.position.set(0, 0.315, 0.085)
    group.add(visor)
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xc2c7d0, roughness: 0.2, metalness: 0.8 })
    for (const s of [-1, 1]) {
      const band = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.07, 0.014), chromeMat)
      band.position.set(s * 0.055, 0.285, 0.062)
      band.rotation.z = s * 0.45
      group.add(band)
    }
  } else if (acc?.type === 'goggles') {
    // Prismatic-lensed goggles pushed up onto the forehead.
    const band = new THREE.Mesh(new THREE.TorusGeometry(0.088, 0.013, 6, 14), new THREE.MeshStandardMaterial({ color: 0x6f5330 }))
    band.position.set(0, 0.345, 0)
    band.rotation.x = Math.PI / 2
    group.add(band)
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xb98a3f, roughness: 0.4, metalness: 0.6 })
    const lensColors = [0x6ef0c6, 0xffe24f, 0x6fa8ff, 0xff7fd0]
    for (const s of [-1, 1]) {
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.009, 6, 12), rimMat)
      rim.position.set(s * 0.038, 0.348, 0.068)
      rim.rotation.x = -0.5
      group.add(rim)
      lensColors.forEach((color, i) => {
        const a = (i / lensColors.length) * Math.PI * 2
        const shard = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 5), new THREE.MeshStandardMaterial({ color }))
        shard.position.set(s * 0.038 + Math.cos(a) * 0.011, 0.348 + Math.sin(a) * 0.011, 0.072)
        group.add(shard)
      })
    }
  }
  return group
}
function buildFigureFor(character) {
  if (character.kind === 'dog') return buildDogFigure()
  if (character.kind === 'bird') return buildBird(character.body, character.wing, character.crest)
  return buildPersonFigure(character)
}

// A floating "<Name> found!" label, canvas-texture sprite (same technique
// as the garden's textSign(), simplified).
function makeEggLabelSprite(text) {
  const canvas = document.createElement('canvas')
  canvas.width = 320; canvas.height = 80
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = 'rgba(20,14,0,0.78)'
  ctx.beginPath(); ctx.roundRect(2, 2, 316, 76, 20); ctx.fill()
  ctx.fillStyle = '#fff8e6'
  ctx.font = '700 30px Arial'
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText(text, 160, 40)
  const tex = new THREE.CanvasTexture(canvas)
  tex.colorSpace = THREE.SRGBColorSpace
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }))
  const baseScale = [0.5, 0.125]
  sprite.scale.set(...baseScale, 1)
  sprite.userData.baseScale = baseScale
  return sprite
}

// A literal two-piece chocolate-egg shell — an upper and lower dome split
// at the equator (the group's local origin), with a ring of polka-dot
// decoration for variety between eggs. `radius`/`scaleY` are exposed via
// userData so openEasterEgg() can compute the lid-lift/label offsets.
const EGG_RADIUS = 0.16
const EGG_SCALE_Y = 1.3
const EGG_REST_Y = EGG_RADIUS * EGG_SCALE_Y // vertical offset so the shell's bottom tip sits on the ground
const EGG_COLOR_PAIRS = [
  [0xff8fa8, 0xfff3d9], [0x8fd9ff, 0xfff8c9], [0xb08fff, 0xd9fff0],
  [0xffd75e, 0xff8fd0], [0x8fff9c, 0xfff0b0], [0xffb26b, 0x9ce8ff],
  [0xff6f61, 0xffe9a0], [0x6fe6c8, 0xffd1e8],
]
function buildEasterEgg(colorTop, colorBottom) {
  const group = new THREE.Group()
  const matTop = new THREE.MeshStandardMaterial({ color: colorTop, roughness: 0.3, metalness: 0.1 })
  const matBottom = new THREE.MeshStandardMaterial({ color: colorBottom, roughness: 0.3, metalness: 0.1 })
  const top = new THREE.Mesh(new THREE.SphereGeometry(EGG_RADIUS, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), matTop)
  top.scale.y = EGG_SCALE_Y
  group.add(top)
  const bottom = new THREE.Mesh(new THREE.SphereGeometry(EGG_RADIUS, 16, 8, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), matBottom)
  bottom.scale.y = EGG_SCALE_Y
  group.add(bottom)
  const dotMat = new THREE.MeshStandardMaterial({ color: colorBottom, roughness: 0.4 })
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2
    const dot = new THREE.Mesh(new THREE.SphereGeometry(EGG_RADIUS * 0.11, 6, 5), dotMat)
    dot.position.set(Math.cos(a) * EGG_RADIUS * 0.97, 0, Math.sin(a) * EGG_RADIUS * 0.97)
    group.add(dot)
  }
  group.userData = { top, bottom }
  return group
}

// The one shared "open the egg" reveal — lid pops up and tips aside, the
// character grows up out of the shell with a name label, holds a couple
// seconds, then both retract so the egg is ready to be reopened. The
// confetti + toast are handled by markFound() (called right after run()
// by the dispatcher), not here, so they fire exactly once per new find.
function openEasterEgg(eggGroup, character) {
  const { top } = eggGroup.userData
  squishPulse(eggGroup, { peak: 1.08, duration: 0.22 })
  const figure = buildFigureFor(character)
  figure.scale.setScalar(0.001)
  eggGroup.add(figure)
  const label = makeEggLabelSprite(`${character.name} found!`)
  const labelBaseScale = label.userData.baseScale
  label.scale.set(0.001, 0.001, 1)
  label.position.set(0, EGG_REST_Y * 2.2, 0)
  eggGroup.add(label)

  let elapsed = 0
  const liftDuration = 0.35, popDuration = 0.35, holdDuration = 2.4, closeDuration = 0.4
  const revealHold = liftDuration + popDuration + holdDuration
  const total = revealHold + closeDuration

  addEggAnimation((dt) => {
    elapsed += dt
    const liftT = elapsed < liftDuration ? elapsed / liftDuration
      : elapsed < revealHold ? 1
      : Math.max(0, 1 - (elapsed - revealHold) / closeDuration)
    // Tipped far enough aside to clear the figure's head — at 0.7 radius the
    // lid sat directly over it and hid exactly the hats/masks/goggles that
    // tell one character from another.
    top.position.set(liftT * EGG_RADIUS * 1.75, liftT * EGG_REST_Y * 1.5, 0)
    top.rotation.z = liftT * 1.05

    let figScale = 0
    if (elapsed > liftDuration) {
      const t = elapsed - liftDuration
      if (t < popDuration) figScale = t / popDuration
      else if (elapsed < revealHold) figScale = 1
      else figScale = Math.max(0, 1 - (elapsed - revealHold) / closeDuration)
    }
    figScale = Math.max(0.001, figScale)
    figure.scale.setScalar(figScale)
    figure.position.y = Math.sin(elapsed * 3) * 0.015
    figure.rotation.y = elapsed * 1.0
    label.scale.set(labelBaseScale[0] * figScale, labelBaseScale[1] * figScale, 1)

    if (elapsed >= total) {
      top.position.set(0, 0, 0); top.rotation.z = 0
      eggGroup.remove(figure); eggGroup.remove(label)
      return false
    }
    return true
  })
}

// Builds one egg prop at `position` — `characterIndex` selects both the
// character (mod 22) and the shell's color pair (mod 8) so neighboring
// eggs don't repeat the same colors.
function buildEggAt(position, characterIndex) {
  const character = POPUP_CHARACTERS[characterIndex % POPUP_CHARACTERS.length]
  const colors = EGG_COLOR_PAIRS[characterIndex % EGG_COLOR_PAIRS.length]
  const egg = buildEasterEgg(colors[0], colors[1])
  egg.position.copy(position)
  scene.add(egg)
  return { egg, character }
}
// Builds an egg and registers its hotspot in one call — the common case.
// A few castle eggs need custom trigger logic (counting jumps) and call
// buildEggAt() directly instead, wiring their own registerHotspot().
function placeEasterEgg(id, trigger, position, characterIndex, triggerOpts = {}) {
  const { egg, character } = buildEggAt(position, characterIndex)
  registerHotspot({
    id, name: character.name, trigger, getWorldPos: () => egg.position,
    ...triggerOpts,
    run: () => openEasterEgg(egg, character),
  })
  return egg
}

// ── Jumping Castle hotspot registration (World 3, TODO.md Phase 8) ──────
// Real node names confirmed by direct-parsing exports/jumping_castle.glb.
// The TODO.md's aspirational "Rib_*"/"InteriorRidge_*"/"WallPanel_*" names
// don't exist in the actual export — the corridor's inflatable-wall
// geometry is all `WallChamber_L_*`/`WallChamber_R_*` (150 total), so every
// wall-surface egg below targets those instead. "Applause Lights" (3x same
// spot) and "Ceiling Confetti Cannon" (5x any spot) are counting eggs: they
// exploit that the dispatcher only fires when getWorldPos() returns a point
// within radius of the current landing — returning a deliberately far-away
// sentinel until the count threshold is reached means getWorldPos's side
// effect (incrementing the counter) runs every landing without the effect
// itself firing early.
function initCastleEggs(hallway) {
  const byPrefix = {}
  hallway.traverse((obj) => {
    for (const p of ['CeilingBulb_', 'CeilingBeam_', 'EdgeBolster_', 'WallChamber_L_', 'WallChamber_R_', 'Frame_left_', 'Frame_right_']) {
      if (obj.name.startsWith(p)) (byPrefix[p] ??= []).push(obj)
    }
  })
  const worldPos = (obj) => { const v = new THREE.Vector3(); obj.getWorldPosition(v); return v }
  const O = 12
  let i = 0

  // Super Bounce Ridge keeps its real-physics side effect (next jump goes
  // ~2x high) alongside the standard egg-open reveal, so it needs its own
  // run() rather than the plain placeEasterEgg() helper.
  const bounceChamber = pick(byPrefix['WallChamber_L_'], 20)
  if (bounceChamber) {
    const { egg, character } = buildEggAt(worldPos(bounceChamber), O + i++)
    registerHotspot({
      id: 'castle-super-bounce-ridge', name: character.name, trigger: 'jump', radius: 2.4,
      getWorldPos: () => egg.position,
      run: () => { bounceBoostMultiplier = Math.SQRT2; openEasterEgg(egg, character) },
    })
  }

  const boingBolster = pick(byPrefix['EdgeBolster_'], 0)
  if (boingBolster) placeEasterEgg('castle-boing-bolster', 'jump', worldPos(boingBolster), O + i++, { radius: 2.6 })

  const discoBulb = pick(byPrefix['CeilingBulb_'], 0)
  if (discoBulb) placeEasterEgg('castle-disco-bulb', 'click', worldPos(discoBulb), O + i++)

  const puffyChamber = pick(byPrefix['WallChamber_L_'], 35)
  if (puffyChamber) placeEasterEgg('castle-puffy-panel', 'click', worldPos(puffyChamber), O + i++)

  const confettiChamber = pick(byPrefix['WallChamber_R_'], 35)
  if (confettiChamber) placeEasterEgg('castle-confetti-rib', 'click', worldPos(confettiChamber), O + i++)

  placeEasterEgg('castle-bouncing-bunny', 'jump', new THREE.Vector3(0, groundHeightAt(0, -18) + EGG_REST_Y, -18), O + i++, { radius: 2.5 })

  const jellyFrame = pick(byPrefix['Frame_left_'], 5)
  if (jellyFrame) placeEasterEgg('castle-jelly-frame', 'click', worldPos(jellyFrame), O + i++)

  // Applause Lights: jump-on the SAME spot 3x. The dispatcher only fires
  // when getWorldPos() lands within radius of the current landing spot, so
  // returning a far-away sentinel until the count threshold is reached lets
  // getWorldPos's side effect (incrementing applauseCount) run on every
  // landing near this spot without the reveal firing early.
  {
    const applausePos = new THREE.Vector3(0, groundHeightAt(0, -30) + EGG_REST_Y, -30)
    const { egg, character } = buildEggAt(applausePos, O + i++)
    let applauseCount = 0
    registerHotspot({
      id: 'castle-applause-lights', name: character.name, trigger: 'jump', radius: 2.4, cooldown: 0.4,
      getWorldPos: () => {
        const dx = camera.position.x - applausePos.x, dz = camera.position.z - applausePos.z
        if (dx * dx + dz * dz < 2.4 * 2.4) applauseCount++
        return applauseCount >= 3 ? egg.position : new THREE.Vector3(9999, 9999, 9999)
      },
      run: () => openEasterEgg(egg, character),
    })
  }

  const squeakyBolster = pick(byPrefix['EdgeBolster_'], 1)
  if (squeakyBolster) placeEasterEgg('castle-squeaky-bolster', 'click', worldPos(squeakyBolster), O + i++)

  const sleepyBeam = pick(byPrefix['CeilingBeam_'], 4)
  if (sleepyBeam) placeEasterEgg('castle-sleepy-beam', 'walk', worldPos(sleepyBeam), O + i++, { radius: 2.2, cooldown: 6 })

  const dominoAnchor = pick(byPrefix['WallChamber_L_'], 50)
  if (dominoAnchor) placeEasterEgg('castle-domino-ribs', 'jump', worldPos(dominoAnchor), O + i++, { radius: 2.4 })

  const blushChamber = pick(byPrefix['WallChamber_R_'], 55)
  if (blushChamber) placeEasterEgg('castle-blushing-panel', 'click', worldPos(blushChamber), O + i++)

  // Ceiling Confetti Cannon: same far-sentinel counting trick as Applause
  // Lights, but "any spot" — radius is irrelevant since the sentinel only

let colliderMeshes = []
let colliderBounds = []
let floorMesh = null
let hallwayReady = false
let mixer = null
let reefSun = null
const sunDirection = new THREE.Vector3()
const surfaceTextures = []
const forestWindTime = { value: 0 }
const forestWindMaterials = new Map()
let forestWindDepth = null
// Imported fern copies share geometry/materials. Batch in 10m bands for
// fewer draw calls while retaining useful distance/frustum culling.
function instanceForestFerns(root) {
  root.updateMatrixWorld(true)
  const inverseRoot = root.matrixWorld.clone().invert()
  const groups = new Map()
  root.traverse(obj => {
    if (!obj.isMesh || !/^Fern_1_/.test(obj.name) || Array.isArray(obj.material)) return
    const band = Math.floor(new THREE.Vector3().setFromMatrixPosition(obj.matrixWorld).z / 10)
    const key = `${obj.geometry.uuid}:${obj.material.uuid}:${band}`
    if (!groups.has(key)) groups.set(key, [])
    groups.get(key).push(obj)
  })
  for (const originals of groups.values()) {
    const first = originals[0]
    const batch = new THREE.InstancedMesh(first.geometry, first.material, originals.length)
    batch.name = 'Forest_Instanced_Ferns'
    batch.castShadow = first.castShadow
    batch.receiveShadow = first.receiveShadow
    originals.forEach((obj, index) => batch.setMatrixAt(index, new THREE.Matrix4().multiplyMatrices(inverseRoot, obj.matrixWorld)))
    batch.instanceMatrix.needsUpdate = true
    batch.computeBoundingSphere()
    root.add(batch)
    for (const obj of originals) obj.removeFromParent()
  }
}

function addForestWind(shader) {
  shader.uniforms.forestWindTime = forestWindTime
  shader.vertexShader = 'uniform float forestWindTime;\n' + shader.vertexShader
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', `
    #include <begin_vertex>
    vec3 forestWorld = (modelMatrix * vec4(position, 1.0)).xyz;
    float forestSway = sin(forestWorld.x * 0.7 + forestWorld.z * 0.45 + forestWindTime * 0.85)
      + 0.35 * sin(forestWorld.z * 1.7 - forestWindTime * 1.2);
    transformed.x += forestSway * 0.035 * smoothstep(2.8, 5.5, forestWorld.y);
  `)
}
function enableForestWind(obj) {
  const windMaterial = (material) => {
    if (!forestWindMaterials.has(material)) {
      const clone = material.clone()
      clone.onBeforeCompile = addForestWind
      clone.customProgramCacheKey = () => 'forest-leaf-wind-v1'
      forestWindMaterials.set(material, clone)
    }
    return forestWindMaterials.get(material)
  }
  obj.material = Array.isArray(obj.material) ? obj.material.map(windMaterial) : windMaterial(obj.material)
  if (!forestWindDepth) {
    forestWindDepth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, side: THREE.DoubleSide })
    forestWindDepth.onBeforeCompile = addForestWind
    forestWindDepth.customProgramCacheKey = () => 'forest-leaf-wind-depth-v1'
  }
  obj.customDepthMaterial = forestWindDepth
}
const reviewFrameTimes = []
let reviewLastFrame = 0

const gltfLoader = new GLTFLoader()
gltfLoader.load(
  SCENE_URL,
  (gltf) => {
    const hallway = gltf.scene
    scene.add(hallway)

    // Fish idle-swim cycles baked in at export (Phase 2/4) — 24 clips, one
    // per fish instance, never played back until now.
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(hallway)
      for (const clip of gltf.animations) {
        mixer.clipAction(clip).play()
      }
    }

    let walkCam = null
    hallway.traverse((obj) => {
      if (obj.name === 'Floor') floorMesh = obj
      if (obj.name === 'WalkCam') walkCam = obj
      if (THEME.colliderPrefixes.some((re) => re.test(obj.name))) colliderMeshes.push(obj)
      if (obj.isMesh) {
        obj.frustumCulled = true
        if (sceneId === 'forest' && /^Forest_(Canopy_Leaves|Distant_Crowns)/.test(obj.name)) enableForestWind(obj)
        obj.receiveShadow = obj.name !== 'Reef_Water_Surface'
        obj.castShadow = obj.name !== 'Reef_Water_Surface' && !obj.name.startsWith('Reef_Seagrass')
        if (sceneId === 'jumping_castle' && /^JCastle_(Venue_Roof|Roof_)/.test(obj.name)) obj.castShadow = false
        if (obj.name === 'Reef_Water_Surface') {
          for (const texture of [obj.material.map, obj.material.normalMap]) {
            if (texture) surfaceTextures.push(texture)
          }
        }
      }
      // Blender's glTF exporter writes directional-light intensity in raw
      // lux (thousands), but three.js applies it as a unitless multiplier —
      // left as exported this blows every material out to solid white.
      // Pin the two art-directed reef lights: Blender versions differ in lux export.
      // Unknown lights retain the existing fallback conversion.
      if (sceneId === 'jumping_castle' && obj.isPointLight) {
        obj.intensity = 8
        obj.distance = 12
        obj.castShadow = false
      }
      if (obj.isDirectionalLight) {
        const li = THEME.lightIntensities
        obj.intensity = obj.name === 'Sun' ? li.Sun : obj.name === 'Fill' ? li.Fill : obj.intensity / li.fallbackDivisor
        if (obj.name === 'Sun') {
          reefSun = obj
          obj.updateWorldMatrix(true, false)
          obj.getWorldDirection(sunDirection)
          obj.castShadow = true
          obj.shadow.mapSize.set(2048, 2048)
          Object.assign(obj.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 0.5, far: 75 })
          obj.shadow.camera.updateProjectionMatrix()
          obj.shadow.normalBias = 0.035
          obj.shadow.bias = -0.00015
          scene.add(obj.target)
        }
      }
    })

    // Two directional lights alone leave anything not facing the sun crushed
    // to near-black — fine for a moody deep-water look, wrong for the bright,
    // evenly-lit "crystal clear shallow water" target (see Museum-locations
    // reference). A hemisphere light fills shadow sides cheaply and evenly.
    scene.add(new THREE.HemisphereLight(THEME.hemisphere.sky, THEME.hemisphere.ground, THEME.hemisphere.intensity))

    if (walkCam) {
      walkCam.updateWorldMatrix(true, false)
      const pos = new THREE.Vector3()
      const quat = new THREE.Quaternion()
      walkCam.getWorldPosition(pos)
      walkCam.getWorldQuaternion(quat)
      const euler = new THREE.Euler().setFromQuaternion(quat, 'YXZ')
      camera.position.set(pos.x, EYE_HEIGHT, pos.z)
      camera.rotation.y = euler.y
      camera.rotation.x = 0
    } else {
      camera.position.set(0, EYE_HEIGHT, 0)
    }

    if (sceneId === 'forest') instanceForestFerns(hallway)
    initArtwork(hallway)

    hallway.updateMatrixWorld(true)
    colliderBounds = colliderMeshes.map((m) => {
      m.geometry.computeBoundingSphere()
      const sphere = m.geometry.boundingSphere.clone().applyMatrix4(m.matrixWorld)
      return { x: sphere.center.x, z: sphere.center.z, radius: sphere.radius }
    })

    if (sceneId === 'jumping_castle') camera.position.y = groundHeightAt(camera.position.x, camera.position.z) + EYE_HEIGHT
    if (sceneId === 'reef') initReefEggs(hallway)
    if (sceneId === 'forest') initForestEggs(hallway)
    if (sceneId === 'jumping_castle') initCastleEggs(hallway)
    if (sceneId === 'gallery_home') initGalleryEggs(hallway)
    hallwayReady = true
    loadingEl.style.display = 'none'
    overlayEl.style.display = reviewMode ? 'none' : 'flex'
    if (reviewMode) {
      const distance = Number(reviewParams.get('distance') || 1)
      camera.position.z = -THREE.MathUtils.clamp(Number.isFinite(distance) ? distance : 1, 1, 56)
      if (sceneId === 'jumping_castle') camera.position.y = groundHeightAt(camera.position.x, camera.position.z) + EYE_HEIGHT
      const reviewPitch = Number(reviewParams.get('pitch') || 0)
      camera.rotation.x = THREE.MathUtils.degToRad(THREE.MathUtils.clamp(Number.isFinite(reviewPitch) ? reviewPitch : 0, -60, 60))
      setTimeout(() => {
        renderer.render(scene, camera)
        console.info(`${sceneId} review:`, JSON.stringify({ calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, textures: renderer.info.memory.textures, camera: camera.position.toArray(), animations: gltf.animations.length }))
        if (['forest', 'jumping_castle'].includes(sceneId) && reviewParams.get('verify') === '1') {
          const savedPosition = camera.position.clone()
          const savedKeys = { ...keys }
          const groundSamples = [-1, -25, -55].map(z => groundHeightAt(0, z))
          camera.position.set(0, EYE_HEIGHT, -1)
          keys.forward = true
          for (let i = 0; i < 80; i++) tick(0.05, true)
          keys.forward = false
          const forwardWalk = Math.abs(camera.position.z + 13.8) < 0.02
          keys.left = true
          for (let i = 0; i < 30; i++) tick(0.05, true)
          keys.left = false
          const edgeStops = camera.position.x >= THEME.walkBounds.minX && blockedAt(camera.position.x - 0.16, camera.position.z)
          camera.position.set(0, EYE_HEIGHT, -59.4)
          keys.forward = true
          for (let i = 0; i < 10; i++) tick(0.05, true)
          const endStops = camera.position.z >= THEME.walkBounds.minZ
          Object.assign(keys, savedKeys)
          camera.position.copy(savedPosition)
          const results = { groundSamples, forwardWalk, edgeStops, endStops }
          console.info(`${sceneId} movement verification:`, JSON.stringify(results))
          if (!forwardWalk || !edgeStops || !endStops || groundSamples.some(y => sceneId === 'forest' ? Math.abs(y) > 0.02 : y < -0.03 || y > 0.14)) console.error(`${sceneId} movement verification failed`)
        }
      }, 1500)
    }
  },
  (xhr) => {
    if (xhr.total) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100)
      document.getElementById('loading-text').textContent = `Loading hallway… ${pct}%`
    }
  },
  (err) => {
    console.error('Failed to load hallway glTF:', err)
    document.getElementById('loading-text').textContent = 'Failed to load hallway — see console.'
  }
)

// ── Artwork pool: random assignment + slow crossfade rotation ───────────
const artworkTexLoader = new THREE.TextureLoader()
const artworkCanvases = []   // [{ material, currentUrl }]
let artworkPool = []         // shuffled queue of not-yet-shown URLs this pass
let artworkAll = []
const artworkFades = []      // [{ material, t }]

function shuffled(arr) {
  const a = arr.slice()
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1))
    ;[a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

// Draws from a shuffled queue of the whole pool, reshuffling once it's
// exhausted, so every photo is shown before any repeats — and never hands
// back the one URL a given frame is already displaying.
function nextArtworkUrl(excludeUrl) {
  if (!artworkPool.length) artworkPool = shuffled(artworkAll)
  let url = artworkPool.pop()
  if (url === excludeUrl && artworkPool.length) {
    artworkPool.unshift(url)
    url = artworkPool.pop()
  }
  return url
}

function setCanvasArtwork(entry, url, { fade = false } = {}) {
  artworkTexLoader.load(url, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace
    tex.flipY = false
    tex.anisotropy = 4
    const mat = entry.material
    const oldTex = mat.map
    mat.map = tex
    entry.currentUrl = url
    if (fade) {
      mat.transparent = true
      mat.opacity = 0
      artworkFades.push({ material: mat, t: 0 })
    }
    mat.needsUpdate = true
    if (oldTex) oldTex.dispose()
  })
}

function scheduleArtworkRotation() {
  const delay = ARTWORK_ROTATE_MIN_MS + Math.random() * (ARTWORK_ROTATE_MAX_MS - ARTWORK_ROTATE_MIN_MS)
  setTimeout(() => {
    if (artworkCanvases.length) {
      const entry = artworkCanvases[Math.floor(Math.random() * artworkCanvases.length)]
      setCanvasArtwork(entry, nextArtworkUrl(entry.currentUrl), { fade: true })
    }
    scheduleArtworkRotation()
  }, delay)
}

function updateArtworkFades(dt) {
  for (let i = artworkFades.length - 1; i >= 0; i--) {
    const f = artworkFades[i]
    f.t += dt
    const p = Math.min(1, f.t / ARTWORK_FADE_SECONDS)
    f.material.opacity = p
    if (p >= 1) {
      f.material.transparent = false
      f.material.needsUpdate = true
      artworkFades.splice(i, 1)
    }
  }
}

// The reef and forest GLBs export their Canvas_* quads with no TEXCOORD_0
// at all (gallery_home and jumping_castle export them fine — an existing
// gap in those two themes' Blender→glTF pipeline, not something a runtime
// fix should mask by regenerating exports). Canvas geometry is always a
// flat 4-vert quad, width along local X per hallway_kit.py's
// place_frame_and_canvas — so a UV can be reconstructed from each vertex's
// position within the quad's own local bounding box. The "height" axis
// isn't consistent across themes, though: wall-mounted canvases
// (gallery/jumping_castle) author it along local Z as hallway_kit does,
// but reef/forest's export bakes an applied ~90° rotation into the canvas
// mesh that moves that same span onto local Y (Z collapses to ~0 there) —
// so detect whichever of Y/Z actually varies rather than assuming Z.
function ensureCanvasUV(mesh) {
  const geo = mesh.geometry
  if (geo.attributes.uv) return
  const pos = geo.attributes.position
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i)
    if (x < minX) minX = x
    if (x > maxX) maxX = x
    if (y < minY) minY = y
    if (y > maxY) maxY = y
    if (z < minZ) minZ = z
    if (z > maxZ) maxZ = z
  }
  const useY = (maxY - minY) > (maxZ - minZ)
  const minV = useY ? minY : minZ
  const spanV = (useY ? maxY - minY : maxZ - minZ) || 1
  const spanU = (maxX - minX) || 1
  // The applied rotation that moves height onto Y also reverses its
  // direction relative to Z (confirmed visually — without the flip here,
  // reef/forest artwork renders upside down), so invert v only in that case.
  const uv = new Float32Array(pos.count * 2)
  for (let i = 0; i < pos.count; i++) {
    const v = useY ? pos.getY(i) : pos.getZ(i)
    let vNorm = (v - minV) / spanV
    if (useY) vNorm = 1 - vNorm
    uv[i * 2 + 0] = (pos.getX(i) - minX) / spanU
    uv[i * 2 + 1] = vNorm
  }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2))
}

async function initArtwork(root) {
  const images = await artworkManifestPromise
  if (!Array.isArray(images) || !images.length) {
    console.warn('Artwork manifest empty or missing — run tools/prepare_artwork.py')
    return
  }
  artworkAll = images.map((name) => ARTWORK_BASE + name)
  artworkPool = shuffled(artworkAll)

  const canvasNodes = []
  root.traverse((obj) => { if (obj.isMesh && /^Canvas_/.test(obj.name)) canvasNodes.push(obj) })
  for (const node of canvasNodes) {
    ensureCanvasUV(node)
    node.material = node.material.clone()
    const entry = { material: node.material, currentUrl: null }
    artworkCanvases.push(entry)
    setCanvasArtwork(entry, nextArtworkUrl())
  }
  scheduleArtworkRotation()
}

// ── Mobile controls: tilt-to-look + on-screen forward/back buttons ──────
// Pointer Lock has no touch equivalent, so touch devices skip `controls`
// entirely and drive the same `camera`/`keys` state that desktop mouse+
// keyboard would, via a separate code path gated by `mobileActive`.
let mobileActive = false
let useOrientationLook = false
const mobileControlsEl = document.getElementById('mobile-controls')

// Classic device-orientation → camera-quaternion conversion (the algorithm
// behind three.js's now-removed DeviceOrientationControls example) — phone
// held vertically in front of you like a window, tilt to look around.
const _zee = new THREE.Vector3(0, 0, 1)
const _q0 = new THREE.Quaternion()
const _q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)) // -PI/2 around world X
let orientationYawOffset = null // calibrated on first reading so "however you're holding the phone" = current facing
function applyDeviceOrientation(evt) {
  if (evt.alpha === null) return // some browsers fire a null-filled event once before real sensor data arrives
  const alpha = THREE.MathUtils.degToRad(evt.alpha)
  const beta = THREE.MathUtils.degToRad(evt.beta || 0)
  const gamma = THREE.MathUtils.degToRad(evt.gamma || 0)
  const screenAngle = THREE.MathUtils.degToRad(screen.orientation?.angle ?? window.orientation ?? 0)
  if (orientationYawOffset === null) orientationYawOffset = camera.rotation.y - alpha
  useOrientationLook = true
  const euler = new THREE.Euler(beta, alpha + orientationYawOffset, -gamma, 'YXZ')
  camera.quaternion.setFromEuler(euler)
  camera.quaternion.multiply(_q1)
  camera.quaternion.multiply(_q0.setFromAxisAngle(_zee, -screenAngle))
}

// Fallback for devices/browsers with no usable orientation sensor (denied
// permission, desktop touchscreens, some Android browsers): drag anywhere
// on the screen outside the move buttons to look around, mouse-look style.
const dragLook = { active: false, lastX: 0, lastY: 0 }
const LOOK_SENSITIVITY = 0.0028
const PITCH_LIMIT = Math.PI / 2 - 0.05
// A tap (short duration, little movement) on the scene also fires a click
// hotspot — distinguished from a look-drag by displacement, not by device,
// so it works whether orientation-look or drag-look is active this session.
const tapTrack = { startTime: 0, startX: 0, startY: 0 }
function onTouchLookStart(e) {
  if (!mobileActive) return
  const t = e.touches[0]
  tapTrack.startTime = performance.now()
  tapTrack.startX = t.clientX
  tapTrack.startY = t.clientY
  if (useOrientationLook) return
  dragLook.active = true
  dragLook.lastX = t.clientX
  dragLook.lastY = t.clientY
}
function onTouchLookMove(e) {
  if (!dragLook.active) return
  const t = e.touches[0]
  const dx = t.clientX - dragLook.lastX
  const dy = t.clientY - dragLook.lastY
  dragLook.lastX = t.clientX
  dragLook.lastY = t.clientY
  camera.rotation.y -= dx * LOOK_SENSITIVITY
  camera.rotation.x = THREE.MathUtils.clamp(camera.rotation.x - dy * LOOK_SENSITIVITY, -PITCH_LIMIT, PITCH_LIMIT)
}
function onTouchLookEnd(e) {
  dragLook.active = false
  const t = e.changedTouches[0]
  const dx = t.clientX - tapTrack.startX, dy = t.clientY - tapTrack.startY
  if (performance.now() - tapTrack.startTime < 300 && dx * dx + dy * dy < 100) tryClickHotspot()
}

function bindMoveButton(el, key) {
  const set = (v) => (e) => { e.preventDefault(); keys[key] = v; el.classList.toggle('active', v) }
  el.addEventListener('touchstart', set(true), { passive: false })
  el.addEventListener('touchend', set(false), { passive: false })
  el.addEventListener('touchcancel', set(false), { passive: false })
  // Mouse events too, so this also works on touch-capable laptops/tablets with a mouse.
  el.addEventListener('mousedown', set(true))
  window.addEventListener('mouseup', set(false))
}
bindMoveButton(document.getElementById('btn-forward'), 'forward')
bindMoveButton(document.getElementById('btn-back'), 'back')

function startMobileExperience() {
  document.documentElement.requestFullscreen?.().catch(() => {})
  const attachOrientation = () => window.addEventListener('deviceorientation', applyDeviceOrientation)
  const requestPermission = window.DeviceOrientationEvent?.requestPermission
  if (typeof requestPermission === 'function') {
    requestPermission().then((state) => { if (state === 'granted') attachOrientation() }).catch(() => {})
  } else if (window.DeviceOrientationEvent) {
    attachOrientation()
  }
  renderer.domElement.addEventListener('touchstart', onTouchLookStart, { passive: true })
  renderer.domElement.addEventListener('touchmove', onTouchLookMove, { passive: true })
  renderer.domElement.addEventListener('touchend', onTouchLookEnd, { passive: true })
  mobileActive = true
  overlayEl.style.display = 'none'
  crosshairEl.style.display = 'block'
  mobileControlsEl.classList.add('show')
  hudEl.classList.add('show')
}

// ── Jumping (jumping_castle only) ────────────────────────────────────────
// height/velocityY/forwardSpeed are integrated in tick() only while
// `jumping` is true, so idle scenes and non-castle themes pay zero cost.
let jumpHeight = 0
let jumpVelocityY = 0
let jumpForwardSpeed = 0
let jumping = false
// Set to sqrt(2) by the "Super Bounce Ridge" egg (TODO.md World 3) for a
// one-shot ~2x-height next jump — height scales with velocity squared, so
// a sqrt(2) velocity multiplier doubles peak height. Consumed on next use.
let bounceBoostMultiplier = 1

function tryJump() {
  if (sceneId !== 'jumping_castle' || !hallwayReady) return
  if (!(controls.isLocked || mobileActive)) return
  if (jumpHeight > JUMP_REJUMP_THRESHOLD) return // must be back near the floor to jump again
  jumpVelocityY = JUMP_VELOCITY * bounceBoostMultiplier
  bounceBoostMultiplier = 1
  jumpForwardSpeed = JUMP_FORWARD_BOOST
  jumping = true
}

if (sceneId === 'jumping_castle') mobileControlsEl.classList.add('jumping-castle')
function bindJumpButton(el) {
  const press = (e) => { e.preventDefault(); el.classList.add('active'); tryJump() }
  const release = (e) => { e.preventDefault(); el.classList.remove('active') }
  el.addEventListener('touchstart', press, { passive: false })
  el.addEventListener('touchend', release, { passive: false })
  el.addEventListener('touchcancel', release, { passive: false })
  el.addEventListener('mousedown', press)
  window.addEventListener('mouseup', release)
}
bindJumpButton(document.getElementById('btn-jump'))

if (sceneId === 'jumping_castle') {
  const desktopHint = document.querySelector('.desktop-hint')
  if (desktopHint) desktopHint.textContent += ' · Space to jump'
  const touchHint = document.querySelector('.touch-hint')
  if (touchHint) touchHint.textContent += ' · 🦘 to bounce'
}

// ── Collision helpers ────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster()
const DOWN = new THREE.Vector3(0, -1, 0)

function groundHeightAt(x, z) {
  if (!floorMesh) return FALLBACK_GROUND_Y
  raycaster.set(new THREE.Vector3(x, 50, z), DOWN)
  raycaster.far = 200
  const hits = raycaster.intersectObject(floorMesh, false)
  return hits.length ? hits[0].point.y : FALLBACK_GROUND_Y
}

// Circle-vs-circle test in the XZ plane rather than a thin raycast — a
// single-axis ray with a short range can slip between sparse, thin
// colliders (posts ~3m apart) without ever registering a hit.
function blockedAt(x, z) {
  const bounds = THEME.walkBounds
  if (bounds && (x < bounds.minX || x > bounds.maxX || z < bounds.minZ || z > bounds.maxZ)) return true
  for (const c of colliderBounds) {
    const dx = x - c.x
    const dz = z - c.z
    const minDist = COLLISION_RADIUS + c.radius
    if (dx * dx + dz * dz < minDist * minDist) return true
  }
  return false
}

// ── Animation loop ────────────────────────────────────────────────────────
const clock = new THREE.Clock()
const forwardVec = new THREE.Vector3()
const rightVec = new THREE.Vector3()
const moveVec = new THREE.Vector3()

// Drift particles upward and recycle any that fall too far behind/ahead of
// the walking camera, so the field always reads as a constant ambient haze
// of suspended particulates rather than a fixed band in world space.
function updateParticles(dt, camZ) {
  const arr = particleGeo.attributes.position.array
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const iy = i * 3 + 1
    arr[iy] += particleSpeeds[i] * dt
    if (arr[iy] > 3.0) arr[iy] = 0.1
    const iz = i * 3 + 2
    const dz = arr[iz] - camZ
    if (dz > PARTICLE_FIELD_RADIUS) arr[iz] -= PARTICLE_FIELD_RADIUS * 2
    else if (dz < -PARTICLE_FIELD_RADIUS) arr[iz] += PARTICLE_FIELD_RADIUS * 2
  }
  particleGeo.attributes.position.needsUpdate = true
}

function tick(dt, forced) {
  forestWindTime.value += dt
  if (hallwayReady && (controls.isLocked || mobileActive || forced)) {
    camera.getWorldDirection(forwardVec)
    forwardVec.y = 0
    forwardVec.normalize()
    rightVec.crossVectors(forwardVec, camera.up).normalize()

    moveVec.set(0, 0, 0)
    if (keys.forward) moveVec.add(forwardVec)
    if (keys.back) moveVec.sub(forwardVec)
    if (keys.right) moveVec.add(rightVec)
    if (keys.left) moveVec.sub(rightVec)
    if (moveVec.lengthSq() > 0) {
      moveVec.normalize().multiplyScalar(MOVE_SPEED * dt)

      if (moveVec.x !== 0 && !blockedAt(camera.position.x + moveVec.x, camera.position.z)) {
        camera.position.x += moveVec.x
      }
      if (moveVec.z !== 0 && !blockedAt(camera.position.x, camera.position.z + moveVec.z)) {
        camera.position.z += moveVec.z
      }
    }

    if (jumping) {
      jumpVelocityY += JUMP_GRAVITY * dt
      jumpHeight += jumpVelocityY * dt
      if (jumpHeight <= 0) {
        jumpHeight = 0
        if (jumpVelocityY < -JUMP_MIN_BOUNCE_VELOCITY) {
          jumpVelocityY = -jumpVelocityY * JUMP_BOUNCE_DAMPING // settle bounce, losing most of its energy each time
        } else {
          jumpVelocityY = 0
          jumping = false
        }
        onJumpLanding()
      }
      if (jumpForwardSpeed > 0.005) {
        const jx = forwardVec.x * jumpForwardSpeed * dt
        const jz = forwardVec.z * jumpForwardSpeed * dt
        if (jx !== 0 && !blockedAt(camera.position.x + jx, camera.position.z)) camera.position.x += jx
        if (jz !== 0 && !blockedAt(camera.position.x, camera.position.z + jz)) camera.position.z += jz
        jumpForwardSpeed *= Math.pow(JUMP_FORWARD_DECAY, dt)
      } else {
        jumpForwardSpeed = 0
      }
    }

    const groundY = groundHeightAt(camera.position.x, camera.position.z)
    camera.position.y = groundY + EYE_HEIGHT + jumpHeight
  }
  for (const texture of surfaceTextures) {
    texture.offset.x += dt * 0.003
    texture.offset.y += dt * 0.0015
  }
  if (reefSun) {
    // Keep one modest shadow map focused on the visible walking area.
    reefSun.target.position.set(camera.position.x, 0, camera.position.z - 8)
    reefSun.position.copy(reefSun.target.position).addScaledVector(sunDirection, 30)
    reefSun.target.updateMatrixWorld()
  }
  if (forestSky) forestSky.update(dt, camera, sunDirection)
  updateArtworkFades(dt)
  updateParticles(dt, camera.position.z)
  if (mixer) mixer.update(dt)
  // Runs after mixer.update so additive egg effects (e.g. a fish's barrel
  // roll or follow-pull) layer on top of that frame's clip-driven pose
  // instead of being immediately overwritten by it.
  updateEggAnimations(dt)
  if (controls.isLocked || mobileActive) updateProximityHotspots()
  updateHotspotHoverHint()
  composer.render()
  if (reviewMode && reviewParams.get('verify') !== '1' && hallwayReady && reviewFrameTimes.length < 180 && document.visibilityState === 'visible') {
    const now = performance.now()
    if (reviewLastFrame) reviewFrameTimes.push(now - reviewLastFrame)
    reviewLastFrame = now
    if (reviewFrameTimes.length === 180) {
      const frames = reviewFrameTimes.slice(60).sort((a, b) => a - b)
      console.info(`${sceneId} frame timing:`, JSON.stringify({ medianMs: frames[60], p95Ms: frames[114], meanFps: 1000 / (frames.reduce((a,b) => a+b, 0) / frames.length) }))
    }
  }
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1)
  tick(dt, window.__debug?.forceLocked)
})

// Debug hook — lets automated testing drive movement when Pointer Lock is
// unavailable (e.g. under CDP browser automation). No effect on normal play.
window.__debug = {
  camera, keys, colliderMeshes, groundHeightAt, blockedAt, renderer, composer, scene,
  getMixer: () => mixer,
  forceLocked: false, THREE,
  getFloorMesh: () => floorMesh,
  getColliderBounds: () => colliderBounds,
  getForward: () => { const v = new THREE.Vector3(); camera.getWorldDirection(v); v.y = 0; v.normalize(); return [v.x, v.y, v.z] },
  step: (n = 1, dt = 0.05) => { for (let i = 0; i < n; i++) tick(dt, true) },
  startMobileExperience,
  isMobileActive: () => mobileActive,
  isOrientationLook: () => useOrientationLook,
  simulateOrientation: applyDeviceOrientation,
  hotspots, getEggsTotal: () => eggsTotal, getFoundEggs: () => [...foundEggs],
  triggerHotspot: (id) => { const h = hotspots.find((x) => x.id === id); if (h) { h.run(h); markFound(h.id, h.name) } },
  findAimedClickHotspot, updateHotspotHoverHint,
  getHoverHint: () => ({ crosshairHotspot: crosshairEl.classList.contains('hotspot'), hintText: hotspotHintEl.textContent, hintShown: hotspotHintEl.classList.contains('show') }),
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(window.innerWidth, window.innerHeight)
  composer.setSize(window.innerWidth, window.innerHeight)
  bloomPass.setSize(window.innerWidth, window.innerHeight)
})

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}))
}
</script>
</body>
</html>
